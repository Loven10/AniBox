name: Build AniBox APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/anibox/app
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AniBox"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.anibox.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.anibox.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="AniBox">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/anibox/app/MainActivity.java <<'EOF'
          package com.anibox.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AniBox</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;padding:24px;color:#f7f5ff;background:radial-gradient(ellipse at top,#30205a,#11101c 55%,#080910);font-family:system-ui,Arial,sans-serif;min-height:100vh}
          header{display:flex;align-items:center;justify-content:space-between;gap:12px}
          .logo{font-size:28px;font-weight:900}.logo span{color:#b79aff}
          .muted{color:#aaa5bf;font-size:12px;margin-top:6px}
          button{border:0;border-radius:13px;padding:12px 16px;background:#a88aff;color:#151020;font-weight:800}
          input,select{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #ffffff20;background:#171624;color:white}
          .section{font-size:19px;font-weight:800;margin:22px 0 14px}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
          .card,.panel{background:#ffffff0b;border:1px solid #ffffff16;border-radius:19px;padding:15px}
          .poster{height:125px;border-radius:13px;display:grid;place-items:center;font-size:39px;background:linear-gradient(135deg,#3b2769,#171827);margin-bottom:12px}
          .title{font-size:16px;font-weight:800;overflow-wrap:anywhere}
          .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
          .secondary{background:#ffffff12;color:white;border:1px solid #ffffff18}
          .hidden{display:none}
          .episode{padding:12px 0;border-bottom:1px solid #ffffff14}
          video{width:100%;max-height:55vh;margin-top:15px;border-radius:14px;background:#000}
          .empty{padding:30px 12px;text-align:center;color:#aaa5bf}
          footer{text-align:center;color:#767188;font-size:12px;margin:35px 0 10px}
          @media(min-width:700px){body{max-width:1000px;margin:auto;padding:35px}}
          </style>
          </head>
          <body>
          <header><div><div class="logo">Ani<span>Box</span> 🎬</div><div class="muted">YOUR PERSONAL ANIME LIBRARY</div></div><button onclick="showForm()">＋ Add</button></header>
          <input id="search" placeholder="Search your anime..." oninput="render()">
          <div class="section">My Library <span id="count" class="muted"></span></div>
          <div id="library" class="grid"></div>
          <section id="form" class="panel hidden">
            <div class="section">Add an anime</div>
            <input id="animeName" placeholder="Anime name">
            <input id="genre" placeholder="Genre">
            <select id="status"><option>Plan to Watch</option><option>Watching</option><option>Completed</option><option>On Hold</option></select>
            <div class="actions"><button onclick="addAnime()">Save Anime</button><button class="secondary" onclick="hideForm()">Cancel</button></div>
          </section>
          <section id="details" class="panel hidden">
            <div class="section" id="detailTitle"></div>
            <div id="detailMeta" class="muted"></div>
            <div class="actions"><button onclick="document.getElementById('videoInput').click()">＋ Import Episode</button><button class="secondary" onclick="closeDetails()">Close</button></div>
            <input id="videoInput" class="hidden" type="file" accept="video/*" onchange="addEpisode(event)">
            <div id="episodes"></div><video id="player" controls playsinline class="hidden"></video>
          </section>
          <footer>AniBox • Your anime, your collection.</footer>
          <script>
          let list=JSON.parse(localStorage.getItem('aniboxLibrary')||'[]'),selected=null,videoURL=null;
          const $=id=>document.getElementById(id);
          function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
          function save(){localStorage.setItem('aniboxLibrary',JSON.stringify(list))}
          function showForm(){$('form').classList.remove('hidden')}
          function hideForm(){$('form').classList.add('hidden')}
          function addAnime(){let name=$('animeName').value.trim();if(!name){alert('Enter an anime name');return}list.unshift({id:Date.now(),name,genre:$('genre').value.trim()||'Anime',status:$('status').value,episodes:[]});save();$('animeName').value='';$('genre').value='';hideForm();render()}
          function render(){let q=$('search').value.toLowerCase(),items=list.filter(a=>a.name.toLowerCase().includes(q)||a.genre.toLowerCase().includes(q));$('count').textContent='('+list.length+')';$('library').innerHTML=items.length?items.map(a=>`<article class="card"><div class="poster">🎞️</div><div class="title">${esc(a.name)}</div><div class="muted">${esc(a.genre)}</div><div class="muted">${esc(a.status)} · ${a.episodes.length} episodes</div><div class="actions"><button onclick="openAnime(${a.id})">Open</button><button class="secondary" onclick="removeAnime(${a.id})">Delete</button></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Your library is empty.<br>Add your first anime ✨</div>'}
          function removeAnime(id){if(confirm('Delete this anime?')){list=list.filter(a=>a.id!==id);save();render();closeDetails()}}
          function openAnime(id){selected=id;let a=list.find(x=>x.id===id);$('details').classList.remove('hidden');$('detailTitle').textContent=a.name;$('detailMeta').textContent=a.genre+' · '+a.status;renderEpisodes();$('details').scrollIntoView({behavior:'smooth'})}
          function closeDetails(){$('details').classList.add('hidden');$('player').pause();if(videoURL)URL.revokeObjectURL(videoURL);videoURL=null;selected=null}
          function addEpisode(e){let f=e.target.files[0],a=list.find(x=>x.id===selected);if(!f||!a)return;a.episodes.push({id:Date.now(),name:f.name,watched:false});save();renderEpisodes();if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(f);$('player').src=videoURL;$('player').classList.remove('hidden');$('player').play().catch(()=>{});e.target.value=''}
          function renderEpisodes(){let a=list.find(x=>x.id===selected);if(!a)return;$('episodes').innerHTML=a.episodes.length?a.episodes.map((e,i)=>`<div class="episode"><div class="title">Episode ${i+1}</div><div class="muted">${esc(e.name)}</div><button class="secondary" onclick="toggle(${e.id})">${e.watched?'✓ Watched':'Mark Watched'}</button></div>`).join(''):'<div class="empty">No episodes yet. Import a video.</div>'}
          function toggle(id){let a=list.find(x=>x.id===selected),e=a.episodes.find(x=>x.id===id);e.watched=!e.watched;save();renderEpisodes()}
          render();
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniBox-APK
          path: app/build/outputs/apk/debug/app-debug.apk
